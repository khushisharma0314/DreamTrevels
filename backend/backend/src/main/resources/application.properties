spring.config.import=optional:file:.env[.properties]

spring.application.name=backend

# =========================================================
# SERVER
# =========================================================
server.port=${PORT:${SERVER_PORT:8080}}

# =========================================================
# DUFFEL - LIVE FLIGHT SEARCH / OFFERS / SEAT MAP / PLACES
# Set DUFFEL_API_TOKEN in the backend environment.
# =========================================================
duffel.api.token=${DUFFEL_API_TOKEN:}

# =========================================================
# BREVO - EMAIL DELIVERY
# Set BREVO_API_KEY in the backend environment.
# =========================================================
brevo.api.key=${BREVO_API_KEY:}
brevo.sender.email=${BREVO_SENDER_EMAIL:}
brevo.sender.name=${BREVO_SENDER_NAME:FareNexa Travel}

# All booking requests are sent here.
company.contact.email=${COMPANY_CONTACT_EMAIL:}

# =========================================================
# APPLICATION URLS
# =========================================================
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# =========================================================
# RESPONSE COMPRESSION
# =========================================================
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024
